name: Sync Wiki catalog

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki-catalog

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # Dispatch Pages after a GITHUB_TOKEN push.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-catalog.mjs
      - id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: npm test && npm run build
        env:
          BASE_PATH: /kivotos-rig-studio/
      - if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/fallbackCatalog.ts src/i18n/studentNames.ts src/i18n/schools.ts src/data/standingArt.ts
          git commit -m "Sync Wiki character catalog"
          git push origin HEAD:main
          gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
